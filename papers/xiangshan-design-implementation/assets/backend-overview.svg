</text>
<polyline points="425,670 370,670 370,410 330,410" fill="none" stroke="#48617b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="370" y="570" font-size="17" text-anchor="end" font-weight="normal" fill="#64748b">
