<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img">
<title>执行路径与ROB跟踪路径</title><desc>分派时并行进入调度结构和ROB；执行结果写回物理寄存器，并向ROB报告完成。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#48617b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
