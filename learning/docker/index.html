    <script>
        (function () {
            var root = document.getElementById('article-content');
            if (!root) return;

            function syncCampLink() {
                var kicker = root.querySelector('.doc-page-kicker');
                if (!kicker || kicker.textContent.indexOf('第 1 /') === -1 || root.querySelector('.camp-source-link')) return;

                var header = root.querySelector('.doc-page-header');
                if (!header) return;

                var paragraph = document.createElement('p');
                paragraph.className = 'camp-source-link';
                paragraph.innerHTML = '训练营地址：<a href="https://opencamp.cn/Docker/camp/202502" target="_blank" rel="noopener noreferrer">2025 第二期 Docker 训练营</a>';
                header.insertAdjacentElement('afterend', paragraph);
            }

            new MutationObserver(syncCampLink).observe(root, { childList: true, subtree: true });
            syncCampLink();
        })();
    </script>
