    <script>
        (function () {
            var root = document.getElementById('article-content');
            var commentsThread = document.getElementById('comments-thread');
            var currentIssueTerm = '';
            var syncScheduled = false;
            if (!root) return;

            function normalizeEscapedBreaks() {
                var paragraphs = root.querySelectorAll('.doc-page-body p');
                Array.prototype.forEach.call(paragraphs, function (paragraph) {
                    var walker = document.createTreeWalker(paragraph, 4);
                    var textNodes = [];
                    var current;

                    while ((current = walker.nextNode())) {
                        if (current.nodeValue.indexOf('<br>') !== -1) textNodes.push(current);
                    }

                    textNodes.forEach(function (textNode) {
                        var parts = textNode.nodeValue.split('<br>');
                        var fragment = document.createDocumentFragment();

                        parts.forEach(function (part, index) {
                            if (index > 0) fragment.appendChild(document.createElement('br'));
                            if (part) fragment.appendChild(document.createTextNode(part));
                        });

                        textNode.parentNode.replaceChild(fragment, textNode);
                    });
                });
            }

            function syncSyntaxHighlighting() {
                if (!window.hljs || typeof window.hljs.highlightElement !== 'function') return;
                var codeBlocks = root.querySelectorAll('.code-block pre code');

                Array.prototype.forEach.call(codeBlocks, function (code) {
                    if (code.classList.contains('hljs')) return;
                    code.classList.remove('nohighlight');
                    try { window.hljs.highlightElement(code); } catch (error) { /* 保留原始代码显示 */ }
                });
            }

            function syncCampLink() {
                var kicker = root.querySelector('.doc-page-kicker');
                if (!kicker || kicker.textContent.indexOf('第 1 /') === -1 || root.querySelector('.camp-source-link')) return;

                var header = root.querySelector('.doc-page-header');
                if (!header) return;

                var paragraph = document.createElement('p');
                paragraph.className = 'camp-source-link';
                paragraph.innerHTML = '训练营地址：<a href="https://opencamp.cn/Docker/camp/202502" target="_blank" rel="noopener noreferrer">2025 第二期 Docker 训练营</a>';
                header.insertAdjacentElement('afterend', paragraph);
            }

            function syncComments() {
                if (!commentsThread) return;
                var heading = root.querySelector('.doc-page-header h1');
                if (!heading) return;

                var issueTerm = 'Docker 学习笔记评论：' + heading.textContent.trim();
                if (issueTerm === currentIssueTerm && commentsThread.querySelector('.utterances')) return;
                currentIssueTerm = issueTerm;
                commentsThread.innerHTML = '';

                var script = document.createElement('script');
                script.src = 'https://utteranc.es/client.js';
                script.setAttribute('repo', 'Kyle0401/Kyle0401.github.io');
                script.setAttribute('issue-term', issueTerm);
                script.setAttribute('theme', 'github-light');
                script.setAttribute('crossorigin', 'anonymous');
                script.async = true;
                commentsThread.appendChild(script);
            }

            function syncPageExtras() {
                syncScheduled = false;
                normalizeEscapedBreaks();
                syncSyntaxHighlighting();
                syncCampLink();
                syncComments();
            }

            function scheduleSync() {
                if (syncScheduled) return;
                syncScheduled = true;
                window.requestAnimationFrame(syncPageExtras);
            }

            new MutationObserver(scheduleSync).observe(root, { childList: true, subtree: true });
            scheduleSync();
        })();
    </script>
