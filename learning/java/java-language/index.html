<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JAVA语言学习：方法 main()、屏幕输出、变量与数据类型、编译器与注释">
    <title>JAVA语言学习 · 学习记录 · Kyle</title>
    <link rel="icon" type="image/svg+xml" href="../../../static/img/logo-jy.svg">
    <link rel="stylesheet" href="../../../static/css/java-note.css">
    <style>
        .java-diagram { width: 100%; max-width: 100%; margin: 24px 0 30px; }
        .java-diagram img { display: block; width: 100%; max-width: 100%; height: auto; object-fit: contain; }

        /* Java code blocks: IntelliJ IDEA Darcula-inspired local syntax highlighting. */
        .article pre.code-block { position: relative; padding-top: 34px; background: #2b2b2b; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 12px 26px rgba(24,31,49,.14); }
        .article pre.code-block::before { position: absolute; top: 10px; left: 15px; padding: 3px 8px; color: #a9b7c6; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); border-radius: 5px; font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace; font-size: 10px; font-weight: 800; letter-spacing: .1em; line-height: 1.2; content: attr(data-language); }
        .article pre.code-block[data-language="java"]::before { content: "JAVA"; color: #ffc66d; }
        .article pre.code-block code { color: #a9b7c6; font-variant-ligatures: none; }
        .java-token.keyword { color: #cc7832; font-weight: 700; }
        .java-token.type { color: #ffc66d; }
        .java-token.string { color: #6a8759; }
        .java-token.character { color: #6a8759; }
        .java-token.comment { color: #808080; font-style: italic; }
        .java-token.number { color: #6897bb; }
        .java-token.literal { color: #cc7832; font-weight: 700; }
        .java-token.annotation { color: #bbb529; }
        .java-token.method { color: #ffc66d; }
        .java-token.class-name { color: #a9b7c6; font-weight: 700; }
        .java-token.operator { color: #a9b7c6; }

        #toc-links > ul,
        #toc-links ul { margin: 0; padding: 0; list-style: none; }
        .toc-tree { width: 100%; }
        .toc-children { margin: 2px 0 6px 2px; padding-left: 8px; border-left: 1px solid #e1e6f1; }
        .toc-row { display: flex; align-items: flex-start; min-width: 0; }
        .toc-link { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; word-break: normal; }
        .toc-item-toggle { flex: 0 0 16px; width: 16px; height: 30px; margin: 0 2px 0 0; padding: 0; color: #7b879a; background: transparent; border: 0; cursor: pointer; font-size: 13px; line-height: 1; transition: color .2s ease, transform .2s ease; }
        .toc-item-toggle:hover { color: var(--note-accent-deep); }
        .toc-item-toggle.is-placeholder { visibility: hidden; pointer-events: none; }
        .toc-item.is-collapsed > .toc-children { display: none; }
        .toc-item.is-collapsed > .toc-row .toc-item-toggle { transform: rotate(-90deg); }
        .toc-level-1 > .toc-row .toc-link { color: #35415b; font-size: 14px; font-weight: 800; }
        .toc-level-2 > .toc-row .toc-link { color: #435066; font-size: 13px; font-weight: 700; }
        .toc-level-3 > .toc-row .toc-link,
        .toc-level-4 > .toc-row .toc-link,
        .toc-level-5 > .toc-row .toc-link,
        .toc-level-6 > .toc-row .toc-link { color: #657084; font-size: 12.5px; font-weight: 500; }
    </style>
</head>
<body>
    <header class="note-topbar">
        <a class="note-brand" href="../../../" aria-label="返回 Kyle 主页">
            <span class="note-brand-mark">K</span>
            <span>Kyle · Learning Records</span>
        </a>
        <a class="note-back" href="../">← 返回 JAVA学习</a>
    </header>

    <div class="note-layout" id="note-layout">
        <aside class="toc" id="toc" aria-label="文章目录">
            <button class="toc-toggle" id="toc-toggle" type="button" aria-expanded="true" aria-controls="toc-content" aria-label="收起文章目录">
                <span class="toc-toggle-icon" aria-hidden="true">☰</span>
                <span class="toc-toggle-text">目录</span>
                <span class="toc-toggle-chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="toc-content" id="toc-content">
                <p class="toc-title">On this page</p>
                <nav id="toc-links" aria-label="文章目录链接"></nav>
            </div>
        </aside>

        <main class="note-main">
            <nav class="breadcrumb" aria-label="面包屑导航">
                <a href="../../../">主页</a><span>/</span>
                <a href="../../">学习记录</a><span>/</span>
                <a href="../">JAVA学习</a><span>/</span>
                <span>JAVA语言学习</span>
            </nav>

            <article class="article" id="article">
                <div id="article-content"><p>正在加载笔记…</p></div>
                <footer class="article-footer">
                    <span>学习记录 · JAVA语言学习</span>
                    <a href="../">返回 JAVA学习目录 →</a>
                </footer>
            </article>
        </main>
    </div>

    <script src="./assets/diagram-part-01.js"></script>
    <script src="./assets/diagram-part-02.js"></script>
    <script src="./assets/diagram-part-03.js"></script>
    <script src="./assets/diagram-part-04.js"></script>
    <script>
        (function () {
            var contentNode = document.getElementById('article-content');
            var tocNode = document.getElementById('toc');
            var tocLinksNode = document.getElementById('toc-links');
            var tocToggle = document.getElementById('toc-toggle');
            var layoutNode = document.getElementById('note-layout');

            function setTocCollapsed(collapsed) {
                tocNode.classList.toggle('is-collapsed', collapsed);
                layoutNode.classList.toggle('toc-collapsed', collapsed);
                tocToggle.setAttribute('aria-expanded', String(!collapsed));
                tocToggle.setAttribute('aria-label', collapsed ? '展开文章目录' : '收起文章目录');
            }

            tocToggle.addEventListener('click', function () {
                setTocCollapsed(!tocNode.classList.contains('is-collapsed'));
            });

            function escapeHtml(value) {
                return value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function inline(value) {
                return escapeHtml(value)
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            }

            function splitTableRow(line) {
                return line.trim().replace(/^\||\|$/g, '').split('|').map(function (cell) {
                    return cell.trim();
                });
            }

            function isBlockStart(line, nextLine) {
                return /^#{1,6}\s+/.test(line) || /^```/.test(line) || /^-{3,}\s*$/.test(line) || /^>\s*\[!(IMPORTANT|CAUTION)\]/.test(line) || /^-\s+/.test(line) || (/^\|/.test(line) && /^\|?\s*:?-{3,}/.test(nextLine || '')) || /^!\[.*?\]\(.+?\)$/.test(line);
            }

            function token(name, value) {
                return '<span class="java-token ' + name + '">' + escapeHtml(value) + '</span>';
            }

            function highlightJava(source) {
                var keywords = {
                    'abstract': 1, 'assert': 1, 'break': 1, 'case': 1, 'catch': 1, 'class': 1, 'const': 1, 'continue': 1, 'default': 1,
                    'do': 1, 'else': 1, 'enum': 1, 'extends': 1, 'final': 1, 'finally': 1, 'for': 1, 'goto': 1, 'if': 1,
                    'implements': 1, 'import': 1, 'instanceof': 1, 'interface': 1, 'new': 1, 'package': 1, 'private': 1, 'protected': 1,
                    'public': 1, 'return': 1, 'static': 1, 'strictfp': 1, 'super': 1, 'switch': 1, 'synchronized': 1, 'this': 1,
                    'throw': 1, 'throws': 1, 'transient': 1, 'try': 1, 'volatile': 1, 'while': 1
                };
                var types = {
                    'boolean': 1, 'byte': 1, 'char': 1, 'double': 1, 'float': 1, 'int': 1, 'long': 1, 'short': 1, 'void': 1,
                    'Boolean': 1, 'Byte': 1, 'Character': 1, 'Double': 1, 'Float': 1, 'Integer': 1, 'Long': 1, 'Short': 1,
                    'String': 1, 'Object': 1, 'System': 1, 'Math': 1, 'Class': 1, 'Exception': 1, 'RuntimeException': 1,
                    'Throwable': 1, 'List': 1, 'ArrayList': 1, 'Map': 1, 'HashMap': 1, 'Set': 1, 'HashSet': 1,
                    'Scanner': 1, 'Arrays': 1, 'Collections': 1
                };
                var literals = { 'true': 1, 'false': 1, 'null': 1 };
                var output = '';
                var index = 0;
                var length = source.length;

                while (index < length) {
                    var current = source.charAt(index);
                    var next = source.charAt(index + 1);

                    if (current === '/' && next === '/') {
                        var lineEnd = source.indexOf('\n', index);
                        if (lineEnd === -1) lineEnd = length;
                        output += token('comment', source.slice(index, lineEnd));
                        index = lineEnd;
                        continue;
                    }

                    if (current === '/' && next === '*') {
                        var blockEnd = source.indexOf('*/', index + 2);
                        if (blockEnd === -1) blockEnd = length - 2;
                        output += token('comment', source.slice(index, blockEnd + 2));
                        index = blockEnd + 2;
                        continue;
                    }

                    if (current === '"' || current === "'") {
                        var quote = current;
                        var stringEnd = index + 1;
                        while (stringEnd < length) {
                            if (source.charAt(stringEnd) === '\\') {
                                stringEnd += 2;
                                continue;
                            }
                            if (source.charAt(stringEnd) === quote) {
                                stringEnd++;
                                break;
                            }
                            stringEnd++;
                        }
                        output += token(quote === '"' ? 'string' : 'character', source.slice(index, stringEnd));
                        index = stringEnd;
                        continue;
                    }

                    if (current === '@' && /[A-Za-z_$]/.test(next || '')) {
                        var annotationEnd = index + 1;
                        while (annotationEnd < length && /[\w$]/.test(source.charAt(annotationEnd))) annotationEnd++;
                        output += token('annotation', source.slice(index, annotationEnd));
                        index = annotationEnd;
                        continue;
                    }

                    if (/[A-Za-z_$]/.test(current)) {
                        var wordEnd = index + 1;
                        while (wordEnd < length && /[\w$]/.test(source.charAt(wordEnd))) wordEnd++;
                        var word = source.slice(index, wordEnd);
                        var after = wordEnd;
                        while (after < length && /\s/.test(source.charAt(after))) after++;
                        var before = index - 1;
                        while (before >= 0 && /\s/.test(source.charAt(before))) before--;
                        var previousWord = source.slice(Math.max(0, before - 12), before + 1);

                        if (keywords[word]) {
                            output += token('keyword', word);
                        } else if (types[word]) {
                            output += token('type', word);
                        } else if (literals[word]) {
                            output += token('literal', word);
                        } else if (/\b(class|interface|enum)\s*$/.test(previousWord)) {
                            output += token('class-name', word);
                        } else if (source.charAt(after) === '(') {
                            output += token('method', word);
                        } else {
                            output += escapeHtml(word);
                        }
                        index = wordEnd;
                        continue;
                    }

                    if (/\d/.test(current)) {
                        var numberEnd = index + 1;
                        while (numberEnd < length && /[\d._xXa-fA-FbBlLfFdDeE+-]/.test(source.charAt(numberEnd))) numberEnd++;
                        output += token('number', source.slice(index, numberEnd));
                        index = numberEnd;
                        continue;
                    }

                    if (/[-+*/%=!<>&|?:]/.test(current)) {
                        output += token('operator', current);
                    } else {
                        output += escapeHtml(current);
                    }
                    index++;
                }

                return output;
            }

            function isJavaBlock(language, source) {
                return /^(java|jdk|javac)$/i.test(language) || /\b(public\s+(static\s+)?void|System\.out|class\s+\w+)\b/.test(source);
            }

            function renderPipeline() {
                return '<figure class="figure java-diagram">' +
                    '<img src="./assets/image-20260613032810576.png" alt="Java 的编译阶段" loading="lazy">' +
                    '<figcaption>Java 的编译阶段</figcaption>' +
                    '</figure>';
            }

            function parseMarkdown(markdown) {
                var lines = markdown.replace(/\r\n?/g, '\n').split('\n');
                var html = [];
                var i = 0;

                while (i < lines.length) {
                    var line = lines[i];
                    var nextLine = lines[i + 1] || '';

                    if (!line.trim()) {
                        i++;
                        continue;
                    }

                    if (/^```/.test(line)) {
                        var language = line.replace(/^```/, '').trim() || 'text';
                        var code = [];
                        i++;
                        while (i < lines.length && !/^```/.test(lines[i])) {
                            code.push(lines[i]);
                            i++;
                        }
                        if (i < lines.length) i++;
                        var sourceCode = code.join('\n');
                        var javaBlock = isJavaBlock(language, sourceCode);
                        var renderedCode = javaBlock ? highlightJava(sourceCode) : escapeHtml(sourceCode);
                        var displayLanguage = javaBlock ? 'java' : language.toLowerCase();
                        html.push('<pre class="code-block" data-language="' + escapeHtml(displayLanguage) + '"><code class="language-' + escapeHtml(displayLanguage) + '">' + renderedCode + '</code></pre>');
                        continue;
                    }

                    if (/^!\[.*?\]\(.+?\)$/.test(line)) {
                        html.push(renderPipeline());
                        i++;
                        continue;
                    }

                    if (/^-{3,}\s*$/.test(line)) {
                        html.push('<hr>');
                        i++;
                        continue;
                    }

                    if (/^>\s*\[!(IMPORTANT|CAUTION)\]/.test(line)) {
                        var kind = line.match(/^>\s*\[!(IMPORTANT|CAUTION)\]/)[1].toLowerCase();
                        var callout = [];
                        i++;
                        while (i < lines.length && (lines[i].startsWith('>') || !lines[i].trim())) {
                            if (lines[i].startsWith('>')) {
                                var message = lines[i].replace(/^>\s?/, '');
                                if (message) callout.push(message);
                            }
                            i++;
                        }
                        html.push('<div class="callout ' + (kind === 'caution' ? 'caution' : '') + '"><div><p>' + inline(callout.join(' ')) + '</p></div></div>');
                        continue;
                    }

                    var heading = line.match(/^(#{1,6})\s+(.+)$/);
                    if (heading) {
                        var level = heading[1].length;
                        html.push('<h' + level + '>' + inline(heading[2]) + '</h' + level + '>');
                        i++;
                        continue;
                    }

                    if (/^\|/.test(line) && /^\|?\s*:?-{3,}/.test(nextLine)) {
                        var headers = splitTableRow(line);
                        i += 2;
                        var rows = [];
                        while (i < lines.length && /^\|/.test(lines[i])) {
                            rows.push(splitTableRow(lines[i]));
                            i++;
                        }
                        var table = '<div class="table-wrap"><table><thead><tr>' + headers.map(function (cell) { return '<th>' + inline(cell) + '</th>'; }).join('') + '</tr></thead><tbody>';
                        rows.forEach(function (row) {
                            table += '<tr>' + headers.map(function (_, index) { return '<td>' + inline(row[index] || '') + '</td>'; }).join('') + '</tr>';
                        });
                        html.push(table + '</tbody></table></div>');
                        continue;
                    }

                    if (/^-\s+/.test(line)) {
                        var items = [];
                        while (i < lines.length && /^-\s+/.test(lines[i])) {
                            items.push(lines[i].replace(/^-\s+/, ''));
                            i++;
                        }
                        html.push('<ul>' + items.map(function (item) { return '<li>' + inline(item) + '</li>'; }).join('') + '</ul>');
                        continue;
                    }

                    var paragraph = [];
                    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i], lines[i + 1] || '')) {
                        paragraph.push(lines[i].trim());
                        i++;
                    }
                    if (paragraph.length) {
                        html.push('<p>' + inline(paragraph.join(' ')) + '</p>');
                    } else {
                        i++;
                    }
                }

                return html.join('');
            }

            function applyUploadedDiagram() {
                var parts = window.__javaDiagramParts || [];
                var image = contentNode.querySelector('.java-diagram img');
                if (!image || parts.length !== 4) return;

                var encodedImage = parts.join('');
                if (encodedImage.length !== 9500) return;

                var dataUrl = 'data:image/png;base64,' + encodedImage;
                var verifier = new Image();
                verifier.onload = function () {
                    image.src = dataUrl;
                };
                verifier.src = dataUrl;
            }

            function buildToc() {
                var headings = Array.prototype.slice.call(contentNode.querySelectorAll('h1, h2, h3, h4, h5, h6'));
                var rootList = document.createElement('ul');
                var stack = [{ level: 0, list: rootList }];
                var h2Index = 0;

                rootList.className = 'toc-tree';
                tocLinksNode.innerHTML = '';

                headings.forEach(function (heading, index) {
                    var level = Number(heading.tagName.slice(1));
                    var label = heading.textContent;
                    var id = 'section-' + (index + 1);
                    heading.id = id;

                    if (level === 2) {
                        h2Index++;
                        heading.innerHTML = '<span class="section-index">' + String(h2Index).padStart(2, '0') + '</span>' + heading.innerHTML;
                    }

                    while (stack.length > 1 && level <= stack[stack.length - 1].level) {
                        stack.pop();
                    }

                    var parent = stack[stack.length - 1];
                    var item = document.createElement('li');
                    item.className = 'toc-item toc-level-' + level;

                    var row = document.createElement('div');
                    row.className = 'toc-row';

                    var itemToggle = document.createElement('button');
                    itemToggle.type = 'button';
                    itemToggle.className = 'toc-item-toggle is-placeholder';
                    itemToggle.setAttribute('aria-hidden', 'true');
                    itemToggle.tabIndex = -1;
                    itemToggle.textContent = '⌄';

                    var link = document.createElement('a');
                    link.className = 'toc-link';
                    link.href = '#' + id;
                    link.textContent = label;

                    var children = document.createElement('ul');
                    children.className = 'toc-children';

                    row.appendChild(itemToggle);
                    row.appendChild(link);
                    item.appendChild(row);
                    item.appendChild(children);
                    parent.list.appendChild(item);
                    stack.push({ level: level, list: children });
                });

                Array.prototype.slice.call(rootList.querySelectorAll('.toc-item')).forEach(function (item) {
                    var children = item.lastElementChild;
                    var itemToggle = item.querySelector(':scope > .toc-row > .toc-item-toggle');

                    if (children && children.children.length > 0) {
                        itemToggle.classList.remove('is-placeholder');
                        itemToggle.removeAttribute('aria-hidden');
                        itemToggle.removeAttribute('tabindex');
                        itemToggle.setAttribute('aria-expanded', 'true');
                        itemToggle.setAttribute('aria-label', '收起子目录');
                        itemToggle.addEventListener('click', function () {
                            var collapsed = item.classList.toggle('is-collapsed');
                            itemToggle.setAttribute('aria-expanded', String(!collapsed));
                            itemToggle.setAttribute('aria-label', collapsed ? '展开子目录' : '收起子目录');
                        });
                    } else if (children) {
                        children.remove();
                    }
                });

                tocLinksNode.appendChild(rootList);
            }

            fetch('./JAVA学习.md')
                .then(function (response) {
                    if (!response.ok) throw new Error('笔记文件读取失败');
                    return response.text();
                })
                .then(function (markdown) {
                    contentNode.innerHTML = parseMarkdown(markdown);
                    applyUploadedDiagram();
                    buildToc();
                })
                .catch(function () {
                    contentNode.innerHTML = '<h1>JAVA学习</h1><div class="article-divider"></div><p>笔记文件暂时无法读取。</p>';
                });
        })();
    </script>
</body>
</html>
