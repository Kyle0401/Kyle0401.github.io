  <meta name="theme-color" id="theme-color" content="#76b900">
  <script>
    (function () {
      'use strict';
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      try {
        var savedTheme = window.localStorage.getItem('cuda-docs-theme');
        if (savedTheme === 'dark' || savedTheme === 'light') dark = savedTheme === 'dark';
      } catch (error) {
        // Storage may be unavailable in privacy modes; the system preference remains the fallback.
      }
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.getElementById('theme-color').setAttribute('content', dark ? '#10140e' : '#76b900');
    })();
  </script>
