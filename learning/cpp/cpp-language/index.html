                '#### 5.1 `static` 关键字',
                '',
                '`static` 在不同上下文中的作用并不相同。下面这个例子中两个 `static` 分别控制函数的链接属性和局部变量的存储期：',
                '',
                '```cpp',
                'static int func(int param) {',
                '    static int static_ = param;',
                '    return static_++;',
                '}',
                '```',
                '',
                '##### 5.1.1 修饰命名空间作用域函数：内部链接',
                '',
                '函数定义前的 `static`：',
                '',
                '```cpp',
                'static int func(int param)',
                '```',
                '',
                '表示该函数具有 **internal linkage（内部链接）**。也就是说，这个名字只在当前翻译单元中可见，其他 `.cpp` 文件不能通过普通的外部声明链接到这个函数。',
                '',
                '> [!NOTE]',
                '> 这里的 `static` 不会让函数“保存上一次调用的状态”。它影响的是函数名的链接属性。现代 C++ 中，如果只是想让命名空间作用域的实体只在当前翻译单元内部使用，也常使用匿名命名空间。',
                '',
                '##### 5.1.2 修饰局部变量：静态存储期',
                '',
                '函数内部的局部 `static` 变量：',
                '',
                '```cpp',
                'static int static_ = param;',
                '```',
                '',
                '仍然具有**局部作用域**，只能在所在代码块中访问；但它具有 **static storage duration（静态存储期）**，对象的存储会持续到程序结束。',
                '',
                '对于这里依赖运行期参数 `param` 的初始化表达式，初始化会在程序第一次执行到这条声明时发生，并且只发生一次。因此第一次调用 `func(5)` 时 `static_` 被初始化为 `5`；之后再调用 `func(4)`、`func(3)` 时，不会重新用新的 `param` 初始化它。',
                '',
                '又因为：',
                '',
                '```cpp',
                'return static_++;',
                '```',
                '',
                '`static_++` 是后置自增：先产生自增前的值作为表达式结果，再把 `static_` 加 `1`。所以连续调用的结果是：',
                '',
                '| 调用 | 返回值 | 调用结束后的 `static_` |',
                '| --- | ---: | ---: |',
                '| `func(5)` | 5 | 6 |',
                '| `func(4)` | 6 | 7 |',
                '| `func(3)` | 7 | 8 |',
                '| `func(2)` | 8 | 9 |',
                '| `func(1)` | 9 | 10 |',
                '',
                '> [!IMPORTANT]',
                '> 局部 `static` 的关键点是：**作用域仍然是局部的，但存储期是静态的，并且动态初始化只执行一次。** 从 C++11 起，局部静态变量的初始化本身保证只执行一次；但初始化完成后，如果多个线程同时修改这个变量，仍然需要程序自己进行同步。',
                '',
                '参考：[cppreference：Storage duration and linkage](https://en.cppreference.com/w/cpp/language/storage_duration.html)',
                ''
            ].join('\n');

            var staticDataMemberSection = [
                '##### 5.1.3 类的静态数据成员：类内声明与类外定义',
                '',
                '类中的 `static` 数据成员不属于某一个具体对象，而是由整个类共享。即使创建了多个对象，程序中通常也只有这一份静态数据成员；它具有静态存储期，其生命周期独立于某个具体对象。',
                '',
                '例如：',
                '',
                '```cpp',
                'struct A {',
                '    static int num_a;',
                '};',
                '',
                'int A::num_a = 0;',
                '```',
                '',
                '对于普通的、非 `inline` 静态数据成员，类体中的：',
                '',
                '```cpp',
                'static int num_a;',
                '```',
                '',
                '只是**声明**，通常还需要在类外提供一次**定义**：',
                '',
                '```cpp',
                'int A::num_a = 0;',
                '```',
                '',
                '类外定义时不要再写 `static`。这里的 `A::` 表示正在定义类 `A` 作用域中的静态数据成员 `num_a`。',
                '',
                '因此下面这种普通非 `const`、非 `inline` 静态数据成员的写法是不正确的：',
                '',
                '```cpp',
                'struct A {',
                '    static int num_a = 0;  // 错误',
                '};',
                '```',
                '',
                '编译器可能报告类似：',
                '',
                '```text',
                "ISO C++ forbids in-class initialization of non-const static member 'A::num_a'",
                '```',
                '',
                '传统写法应改为：',
                '',
                '```cpp',
                'struct A {',
                '    static int num_a;',
                '};',
                '',
                'int A::num_a = 0;',
                '```',
                '',
                '从 **C++17** 起，如果把静态数据成员声明为 `inline`，就可以直接在类内完成定义和初始化，并且不再需要类外定义：',
                '',
                '```cpp',
                'struct A {',
                '    inline static int num_a = 0;',
                '};',
                '```',
                '',
                '本笔记以 C++20 为基线，因此这种 `inline static` 写法完全可用。两种写法可以这样对照：',
                '',
                '| 写法 | 是否需要类外定义 |',
                '| --- | --- |',
                '| `static int num_a;` | 是，通常再写 `int A::num_a = 0;` |',
                '| `inline static int num_a = 0;` | 否（C++17 起） |',
                '',
                '> [!IMPORTANT]',
                '> 静态数据成员不属于某个具体对象。对象的析构函数可以修改它，例如执行 `--num_a` 来维护“当前存活对象数量”，但这只是修改静态成员的值，并不会销毁 `num_a` 本身。静态数据成员自己的生命周期不会随着某个 `A` 对象的析构而结束。',
                '',
                '还要注意，某些 `const` / `constexpr` 静态成员存在额外的类内初始化规则；不能把这些特殊规则泛化到普通的 `static int`。C++17 起，`constexpr` 静态数据成员也隐式具有 `inline` 性质。',
                '',
                '参考：[cppreference：Static members](https://en.cppreference.com/w/cpp/language/static)、[cppreference：Definitions and ODR](https://en.cppreference.com/w/cpp/language/definition)。',
                ''
            ].join('\n');

            var castSection = [
                '### 12、C++ 类型转换与类型双关',
                '',
                'C 风格转换可能尝试多种不同性质的转换，意图不够清晰。C++ 通常优先使用命名转换，使转换目的、检查方式和风险更容易从代码中看出来。',
                '',
                '本章重点区分三种常见的命名转换，并进一步说明枚举转换、`union` 类型双关和 `std::bit_cast`：',
                '',
                '| 工具 | 主要用途 | 是否进行运行时类型检查 |',
                '| --- | --- | --- |',
                '| `static_cast` | 数值、枚举以及继承体系中满足规则的显式转换 | 否 |',
                '| `dynamic_cast` | 多态类层次中的安全向下转换或交叉转换 | 是 |',
                '| `reinterpret_cast` | 标准允许的低层指针/整数等重新解释转换 | 否 |',
                '',
                '#### 12.1 `static_cast`：编译期可检查的显式转换',
                '',
                '`static_cast` 适用于语言规则明确允许的一组显式转换。编译器会检查这种转换形式是否合法，但它**不会在运行时检查对象的动态类型**。',
                '',
                '常见的数值转换：',
                '',
                '```cpp',
                'double value = 3.9;',
                'int integer = static_cast<int>(value); // 结果为 3',
                '```',
                '',
                '枚举与整数、枚举与枚举之间需要明确表达数值转换意图时，也常使用 `static_cast`：',
                '',
                '```cpp',
                'Color color = Color::Green;',
                'int value = static_cast<int>(color);',
                'ColorEnum old_color = static_cast<ColorEnum>(color);',
                '```',
                '',
                '继承体系中也可以进行某些向下转换：',
                '',
                '```cpp',
                'Derived* derived = static_cast<Derived*>(base);',
                '```',
                '',
                '但这里没有运行时检查。只有当 `base` 实际确实指向相应的 `Derived` 对象（或其中正确的基类子对象）时，后续把结果当作 `Derived` 使用才是正确的。因此，当动态类型并不能由程序逻辑可靠保证时，不应把 `static_cast` 当作“安全的向下转换检查”。',
                '',
                '#### 12.2 `dynamic_cast`：多态类型的运行时检查转换',
                '',
                '`dynamic_cast` 用于需要**运行时类型检查**的类层次转换，最典型的场景是从基类指针或引用向派生类转换。进行这类向下转换时，源基类通常需要是多态类型，也就是声明或继承了至少一个虚函数。',
                '',
                '例如：',
                '',
                '```cpp',
                'struct A {',
                '    virtual ~A() = default;',
                '};',
                '',
                'struct B final : A {',
                '};',
                '',
                'A* ab = new B;',
                '```',
                '',
                '此时 `ab` 的静态类型是 `A*`，但所指对象的动态类型是 `B`。指针形式可以写成：',
                '',
                '```cpp',
                'if (B* b = dynamic_cast<B*>(ab)) {',
                '    // 转换成功，可以通过 b 使用 B 对象',
                '}',
                '```',
                '',
                '如果实际动态类型不匹配，**指针形式返回 `nullptr`**，因此通常要检查结果后再使用。',
                '',
                '如果目标是引用，可以直接写：',
                '',
                '```cpp',
                'B& bb = dynamic_cast<B&>(*ab);',
                '```',
                '',
                '引用形式不能用空引用表示失败，因此动态类型不匹配时会抛出 `std::bad_cast`。',
                '',
                '```cpp',
                'delete ab;',
                '```',
                '',
                '这里基类析构函数是虚函数，所以可以通过 `A*` 正确销毁实际的 `B` 对象。',
                '',
                '> [!NOTE]',
                '> `static_cast` 向下转换可以理解为“程序员保证实际类型正确”；`dynamic_cast` 则是“让运行时替我检查实际类型”。若只需要基类已经提供的虚函数接口，通常根本不需要向下转换。更完整的规则见前面的 **9.2 `dynamic_cast`**。',
                '',
                '#### 12.3 `reinterpret_cast`：低层重新解释转换',
                '',
                '`reinterpret_cast` 面向的是标准明确允许的一组**低层转换**，例如某些指针类型之间的转换，以及指针与足够大的整数类型之间的转换。',
                '',
                '它并不是“什么类型都可以强行转换”的万能工具，也不能移除 `const`。即使某个转换本身能够通过编译，转换后的指针如果不满足对象生命周期、对齐、类型可访问性等规则，随后访问对象仍然可能产生未定义行为。',
                '',
                '因此除非是在系统接口、底层内存处理等确实需要表达这种低层意图的场景，否则应尽量避免使用 `reinterpret_cast`。',
                '',
                '#### 12.4 枚举转换与类型双关',
                '',
                '枚举之间如果只是希望转换**数值语义**，应优先使用 `static_cast`，而不是通过内存表示“猜”出另一个类型的值：',
                '',
                '```cpp',
                'ColorEnum convert(Color color)',
                '{',
                '    return static_cast<ColorEnum>(color);',
                '}',
                '```',
                '',
                '`Color` 与 `ColorEnum` 是不同的枚举类型，但 `static_cast` 可以显式完成枚举到枚举的转换。',
                '',
                '这种 `union` 类型双关不要用于实际 C++ 代码：',
                '',
                '```cpp',
                'union TypePun {',
                '    ColorEnum e;',
                '    Color c;',
                '};',
                '',
                'TypePun pun;',
                'pun.c = Color::Red;',
                'return pun.e;  // 标准 C++：读取非活动 union 成员，通常是未定义行为',
                '```',
                '',
                '这类代码真正需要理解的是：',
                '',
                '- `union` 成员共享存储；',
                '- 写入某个成员后，它会成为活动成员；',
                '- C 与 C++ 对 `union` 类型双关的规则不同；',
                '- “内存里碰巧是这些字节”不等于“标准保证可以把它当成另一个类型读取”。',
                '',
                '`reinterpret_cast` 也不是通用修复方案。它只允许标准规定的一组低层转换，并不会绕过对象生命周期、别名和类型访问规则。',
                '',
                '如果目的是“枚举值 A → 枚举值 B”，优先使用：',
                '',
                '```cpp',
                'static_cast<TargetEnum>(source);',
                '```',
                '',
                '如果目的是按位复制同样大小的两个 trivially copyable 类型，C++20 可以考虑 `std::bit_cast`；但它要求源类型和目标类型大小相同。`std::bit_cast` 是标准库函数，不属于语言中的命名转换运算符。',
                '',
                '参考：[`static_cast`](https://en.cppreference.com/w/cpp/language/static_cast)、[`dynamic_cast`](https://en.cppreference.com/w/cpp/language/dynamic_cast)、[`reinterpret_cast`](https://en.cppreference.com/w/cpp/language/reinterpret_cast)、[`union`](https://en.cppreference.com/w/cpp/language/union)、[`std::bit_cast`](https://en.cppreference.com/w/cpp/numeric/bit_cast)。',
                ''
            ].join('\n');
