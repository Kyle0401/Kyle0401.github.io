        (function () {

            var section = [
                '#### 5.1 `static` 关键字',
                '',
                '`static` 在不同上下文中的作用并不相同。下面这个例子中两个 `static` 分别控制函数的链接属性和局部变量的存储期：',
                '',
                '```cpp',
                'static int func(int param) {',
                '    static int static_ = param;',
                '    return static_++;',
                '}',
                '```',
                '',
                '##### 5.1.1 修饰命名空间作用域函数：内部链接',
                '',
                '函数定义前的 `static`：',
                '',
                '```cpp',
                'static int func(int param)',
                '```',
                '',
                '表示该函数具有 **internal linkage（内部链接）**。也就是说，这个名字只在当前翻译单元中可见，其他 `.cpp` 文件不能通过普通的外部声明链接到这个函数。',
                '',
                '> [!NOTE]',
                '> 这里的 `static` 不会让函数“保存上一次调用的状态”。它影响的是函数名的链接属性。现代 C++ 中，如果只是想让命名空间作用域的实体只在当前翻译单元内部使用，也常使用匿名命名空间。',
                '',
                '##### 5.1.2 修饰局部变量：静态存储期',
                '',
                '函数内部的局部 `static` 变量：',
                '',
                '```cpp',
                'static int static_ = param;',
                '```',
                '',
                '仍然具有**局部作用域**，只能在所在代码块中访问；但它具有 **static storage duration（静态存储期）**，对象的存储会持续到程序结束。',
                '',
                '对于这里依赖运行期参数 `param` 的初始化表达式，初始化会在程序第一次执行到这条声明时发生，并且只发生一次。因此第一次调用 `func(5)` 时 `static_` 被初始化为 `5`；之后再调用 `func(4)`、`func(3)` 时，不会重新用新的 `param` 初始化它。',
                '',
                '又因为：',
                '',
                '```cpp',
                'return static_++;',
                '```',
                '',
                '`static_++` 是后置自增：先产生自增前的值作为表达式结果，再把 `static_` 加 `1`。所以连续调用的结果是：',
                '',
                '| 调用 | 返回值 | 调用结束后的 `static_` |',
                '| --- | ---: | ---: |',
                '| `func(5)` | 5 | 6 |',
                '| `func(4)` | 6 | 7 |',
                '| `func(3)` | 7 | 8 |',
                '| `func(2)` | 8 | 9 |',
                '| `func(1)` | 9 | 10 |',
                '',
                '> [!IMPORTANT]',
                '> 局部 `static` 的关键点是：**作用域仍然是局部的，但存储期是静态的，并且动态初始化只执行一次。** 从 C++11 起，局部静态变量的初始化本身保证只执行一次；但初始化完成后，如果多个线程同时修改这个变量，仍然需要程序自己进行同步。',
                '',
                '参考：[cppreference：Storage duration and linkage](https://en.cppreference.com/w/cpp/language/storage_duration.html)',
                ''
            ].join('\n');

            var staticDataMemberSection = [
                '##### 5.1.3 类的静态数据成员：类内声明与类外定义',
                '',
                '类中的 `static` 数据成员不属于某一个具体对象，而是由整个类共享。即使创建了多个对象，程序中通常也只有这一份静态数据成员；它具有静态存储期，其生命周期独立于某个具体对象。',
                '',
                '例如：',
                '',
                '```cpp',
                'struct A {',
                '    static int num_a;',
                '};',
                '',
                'int A::num_a = 0;',
                '```',
                '',
                '对于普通的、非 `inline` 静态数据成员，类体中的：',
                '',
                '```cpp',
                'static int num_a;',
                '```',
                '',
                '只是**声明**，通常还需要在类外提供一次**定义**：',
                '',
                '```cpp',
                'int A::num_a = 0;',
                '```',
                '',
                '类外定义时不要再写 `static`。这里的 `A::` 表示正在定义类 `A` 作用域中的静态数据成员 `num_a`。',
                '',
                '因此下面这种普通非 `const`、非 `inline` 静态数据成员的写法是不正确的：',
                '',
                '```cpp',
                'struct A {',
                '    static int num_a = 0;  // 错误',
                '};',
                '```',
                '',
                '编译器可能报告类似：',
                '',
                '```text',
                "ISO C++ forbids in-class initialization of non-const static member 'A::num_a'",
                '```',
                '',
                '传统写法应改为：',
                '',
                '```cpp',
                'struct A {',
                '    static int num_a;',
                '};',
                '',
                'int A::num_a = 0;',
                '```',
                '',
                '从 **C++17** 起，如果把静态数据成员声明为 `inline`，就可以直接在类内完成定义和初始化，并且不再需要类外定义：',
                '',
                '```cpp',
                'struct A {',
                '    inline static int num_a = 0;',
                '};',
                '```',
                '',
                '本笔记以 C++20 为基线，因此这种 `inline static` 写法完全可用。两种写法可以这样对照：',
                '',
                '| 写法 | 是否需要类外定义 |',
                '| --- | --- |',
                '| `static int num_a;` | 是，通常再写 `int A::num_a = 0;` |',
                '| `inline static int num_a = 0;` | 否（C++17 起） |',
                '',
                '> [!IMPORTANT]',
                '> 静态数据成员不属于某个具体对象。对象的析构函数可以修改它，例如执行 `--num_a` 来维护“当前存活对象数量”，但这只是修改静态成员的值，并不会销毁 `num_a` 本身。静态数据成员自己的生命周期不会随着某个 `A` 对象的析构而结束。',
                '',
                '还要注意，某些 `const` / `constexpr` 静态成员存在额外的类内初始化规则；不能把这些特殊规则泛化到普通的 `static int`。C++17 起，`constexpr` 静态数据成员也隐式具有 `inline` 性质。',
                '',
                '参考：[cppreference：Static members](https://en.cppreference.com/w/cpp/language/static)、[cppreference：Definitions and ODR](https://en.cppreference.com/w/cpp/language/definition)。',
                ''
            ].join('\n');

            var inheritanceSection = [
                '### 9、继承与派生类对象',
                '',
                '',
                '#### 9.1 公有继承',
                '',
                '最基本的公有继承写法：',
                '',
                '```cpp',
                'struct A {',
                '};',
                '',
                'struct B : public A {',
                '};',
                '```',
                '',
                '`B : public A` 表示 `B` 公有继承自 `A`。一个 `B` 对象内部包含一个 `A` **基类子对象（base class subobject）**，因此可以把 `B` 对象看成“在 `A` 部分的基础上，再增加 `B` 自己的部分”。',
                '',
                '```text',
                'B 对象',
                '┌──────────────┐',
                '│ A 基类子对象 │',
                '├──────────────┤',
                '│ B 自己的部分 │',
                '└──────────────┘',
                '```',
                '',
                '在公有且无歧义的继承关系下，派生类指针和引用可以隐式向上转换为基类指针和引用：',
                '',
                '```cpp',
                'B b;',
                '',
                'A* pa = &b;',
                'A& ra = b;',
                '```',
                '',
                '这个方向叫作**向上转换（upcast）**。它不需要显式写 cast，因为每个 `B` 对象都确实包含一个 `A` 基类子对象。',
                '',
                '相反，从 `A*` / `A&` 向 `B*` / `B&` 转换属于向下转换，不能仅凭静态类型保证实际对象一定是 `B`。具体的 `static_cast` 与 `dynamic_cast` 规则统一见第 12 章。',
                '',
                '#### 9.2 派生类对象的构造与析构顺序',
                '',
                '因为派生类对象内部包含基类子对象，所以构造派生类之前必须先把基类部分构造好。',
                '',
                '```cpp',
                'struct A {',
                '    A() {',
                '        // 构造 A 部分',
                '    }',
                '',
                '    ~A() {',
                '        // 析构 A 部分',
                '    }',
                '};',
                '',
                'struct B : public A {',
                '    B() {',
                '        // 构造 B 自己的部分',
                '    }',
                '',
                '    ~B() {',
                '        // 析构 B 自己的部分',
                '    }',
                '};',
                '```',
                '',
                '在这种简单的单继承情况下，创建 `B` 时的顺序是：',
                '',
                '```text',
                'A::A()',
                '  ↓',
                'B::B()',
                '```',
                '',
                '也就是：',
                '',
                '> **构造：先基类，后派生类。**',
                '',
                '析构顺序正好相反：',
                '',
                '```text',
                'B::~B()',
                '   ↓',
                'A::~A()',
                '```',
                '',
                '> **析构：先派生类，后基类。**',
                '',
                '静态计数器可以很直观地观察这个过程：',
                '',
                '```cpp',
                'struct A {',
                '    inline static int num_a = 0;',
                '',
                '    A() {',
                '        ++num_a;',
                '    }',
                '',
                '    ~A() {',
                '        --num_a;',
                '    }',
                '};',
                '',
                'struct B : public A {',
                '    inline static int num_b = 0;',
                '',
                '    B() {',
                '        ++num_b;',
                '    }',
                '',
                '    ~B() {',
                '        --num_b;',
                '    }',
                '};',
                '```',
                '',
                '若开始时两个计数器都是 `0`，执行：',
                '',
                '```cpp',
                'B* b = new B;',
                '```',
                '',
                '实际发生的是：',
                '',
                '```text',
                'A::A()  → A::num_a: 0 → 1',
                'B::B()  → B::num_b: 0 → 1',
                '```',
                '',
                '所以一个完整的 `B` 对象同时贡献一个存活的 `A` 基类子对象和一个 `B` 对象。执行 `delete b;` 时则按相反顺序：',
                '',
                '```text',
                'B::~B() → B::num_b: 1 → 0',
                'A::~A() → A::num_a: 1 → 0',
                '```',
                '',
                '更完整地说，构造最派生对象时会先构造基类子对象，再按声明顺序构造非静态数据成员，最后执行当前类构造函数体；析构总体按相反方向进行。多继承和虚继承还有更具体的顺序规则。',
                '',
                '#### 9.3 通过基类指针删除派生类对象：虚析构函数',
                '',
                '如果一个派生类对象可能通过基类指针被 `delete`，基类析构函数必须是虚函数：',
                '',
                '```cpp',
                'struct A {',
                '    virtual ~A() = default;',
                '};',
                '',
                'struct B : A {',
                '    ~B() override = default;',
                '};',
                '',
                'A* p = new B;',
                'delete p;',
                '```',
                '',
                '这里 `p` 的静态类型是 `A*`，但实际对象的动态类型是 `B`。因为 `A::~A()` 是虚析构函数，`delete p` 会启动完整的多态析构过程：',
                '',
                '```text',
                'delete p',
                '   ↓',
                'B::~B()',
                '   ↓',
                'A::~A()',
                '```',
                '',
                '如果 `A::~A()` 不是虚函数，却通过 `A*` 删除实际的 `B` 对象，则行为是**未定义行为（undefined behavior）**，不能依赖某个特定编译器恰好表现成“只调用基类析构函数”。',
                '',
                '还要注意，类中存在其他虚函数并不会自动让析构函数变成虚函数：',
                '',
                '```cpp',
                'struct A {',
                '    virtual void f();',
                '    ~A() = default;  // 仍然是非虚析构函数',
                '};',
                '```',
                '',
                '若需要经基类指针销毁派生对象，应单独声明：',
                '',
                '```cpp',
                'virtual ~A() = default;',
                '```',
                '',
                '> [!NOTE]',
                '> 本节使用裸 `new` / `delete` 只是为了直接展示多态析构机制，并不是在推荐实际项目手动管理动态对象。智能指针与所有权模型见第 14 章。',
                '',
                '参考：[cppreference：Derived classes](https://en.cppreference.com/w/cpp/language/derived_class)、[cppreference：Destructors](https://en.cppreference.com/w/cpp/language/destructor)、[cppreference：Virtual functions](https://en.cppreference.com/w/cpp/language/virtual)。',
                ''
            ].join('\n');

            var castSection = [
                '### 12、C++ 命名类型转换',
                '',
                'C 风格转换可能尝试多种不同性质的转换，转换意图不够明确。C++ 提供四种命名类型转换（named casts），让代码直接表达“为什么要转、允许检查到什么程度”。',
                '',
                '| 转换 | 主要用途 | 运行时类型检查 |',
                '| --- | --- | --- |',
                '| `static_cast` | 数值、枚举以及语言规则允许的继承体系转换 | 否 |',
                '| `dynamic_cast` | 多态类层次中的安全向下转换、交叉转换 | 是 |',
                '| `const_cast` | 调整 `const` / `volatile` 限定 | 否 |',
                '| `reinterpret_cast` | 标准允许的低层指针、整数等重新解释转换 | 否 |',
                '',
                '#### 12.1 `static_cast`：语言规则允许的显式转换',
                '',
                '`static_cast` 适用于编译器能够根据静态类型判断“这种转换形式是否允许”的场景，但它不会在运行时验证对象的动态类型。',
                '',
                '数值转换：',
                '',
                '```cpp',
                'double value = 3.9;',
                'int integer = static_cast<int>(value); // 结果为 3',
                '```',
                '',
                '枚举转换：',
                '',
                '```cpp',
                'Color color = Color::Green;',
                'int value = static_cast<int>(color);',
                'ColorEnum old_color = static_cast<ColorEnum>(color);',
                '```',
                '',
                '在继承体系中，向上转换通常不需要显式 cast：',
                '',
                '```cpp',
                'B b;',
                'A* base = &b;  // B* → A*，隐式向上转换',
                '```',
                '',
                '从基类指针向派生类指针的向下转换可以在满足规则时写成：',
                '',
                '```cpp',
                'B* derived = static_cast<B*>(base);',
                '```',
                '',
                '但 `static_cast` **不检查 `base` 实际是否指向 `B` 对象**。只有当程序逻辑已经可靠保证实际对象类型正确时，才能安全地把转换结果当作 `B` 使用。',
                '',
                '#### 12.2 `dynamic_cast`：多态类型的运行时检查转换',
                '',
                '`dynamic_cast` 用于类层次中的运行时类型检查。最典型的用途，是手中只有基类指针或引用，但确实需要确认实际对象是否属于某个派生类型。',
                '',
                '例如：',
                '',
                '```cpp',
                'struct A {',
                '    virtual ~A() = default;',
                '};',
                '',
                'struct B final : A {',
                '};',
                '',
                'A* ab = new B;',
                '```',
                '',
                '此时：',
                '',
                '```text',
                'ab 的静态类型：A*',
                'ab 所指对象的动态类型：B',
                '```',
                '',
                '对于这种运行时检查的向下转换，源类型需要满足 `dynamic_cast` 的多态类型要求；实际学习中最常见的情况就是基类至少声明了一个虚函数。',
                '',
                '**指针形式：失败返回 `nullptr`**',
                '',
                '```cpp',
                'if (B* b = dynamic_cast<B*>(ab)) {',
                '    // 转换成功',
                '}',
                '```',
                '',
                '如果实际对象不是目标类型，指针转换返回空指针，因此不要直接解引用未经检查的结果。',
                '',
                '**引用形式：失败抛出 `std::bad_cast`**',
                '',
                '```cpp',
                '#include <typeinfo>',
                '',
                'try {',
                '    B& b = dynamic_cast<B&>(*ab);',
                '    // 转换成功',
                '}',
                'catch (const std::bad_cast&) {',
                '    // 动态类型不匹配',
                '}',
                '```',
                '',
                '在已经明确知道 `ab` 来自：',
                '',
                '```cpp',
                'A* ab = new B;',
                '```',
                '',
                '时，下面的转换能够成功：',
                '',
                '```cpp',
                'B& bb = dynamic_cast<B&>(*ab);',
                '```',
                '',
                '可以把 `static_cast` 和 `dynamic_cast` 的向下转换区别粗略记成：',
                '',
                '```text',
                'static_cast  → “程序逻辑已经保证它就是 B”',
                'dynamic_cast → “请运行时替我检查它是不是 B”',
                '```',
                '',
                '> [!NOTE]',
                '> 如果只需要调用基类已经提供的虚函数，通常无需向下转换。优先通过基类接口使用多态，只有确实需要派生类专属接口时再考虑 `dynamic_cast`。',
                '',
                '#### 12.3 `const_cast`：调整 cv 限定',
                '',
                '`const_cast` 主要用于增加或移除 `const` / `volatile` 限定。四种命名转换中，只有 `const_cast` 专门负责这类 cv 限定转换。',
                '',
                '例如：',
                '',
                '```cpp',
                'const int value = 10;',
                'const int* p = &value;',
                'int* q = const_cast<int*>(p);',
                '```',
                '',
                '这只改变了访问表达式的类型，并不会把一个原本真正的 `const` 对象变成可修改对象。若 `value` 本身就是 `const` 对象，再通过 `q` 修改它会产生未定义行为：',
                '',
                '```cpp',
                '*q = 20;  // 未定义行为：原对象本身是 const',
                '```',
                '',
                '如果底层对象本来就是非 `const`，只是暂时通过 `const` 指针或引用观察它，那么在满足其他条件时去掉这个访问路径上的 `const` 后修改原对象可以成立：',
                '',
                '```cpp',
                'int value = 10;',
                'const int* p = &value;',
                'int* q = const_cast<int*>(p);',
                '*q = 20;  // value 现在为 20',
                '```',
                '',
                '因此不要把 `const_cast` 理解成“强行把常量改成变量”；关键要看**原对象本身是否真的被定义为 const**。',
                '',
                '#### 12.4 `reinterpret_cast`：低层重新解释转换',
                '',
                '`reinterpret_cast` 面向标准明确允许的一组低层转换，例如某些指针类型之间的转换，以及指针与足够大的整数类型之间的转换。',
                '',
                '它不是“什么都能强转”的万能工具，也不能用来移除 `const`。即使转换本身能够编译，转换后的指针如果不满足对象生命周期、对齐、类型可访问性等规则，后续访问仍可能产生未定义行为。',
                '',
                '因此除系统接口、底层内存处理等确实需要表达这种低层意图的场景外，应谨慎使用 `reinterpret_cast`。',
                '',
                '> [!NOTE]',
                '> `reinterpret_cast` 不等于标准的“类型双关工具”。关于 `union` 活动成员、类型双关和 C++20 `std::bit_cast` 的内容已经放在“一、C++基础 → 10.3 联合体 `union`”中，本章不再重复。',
                '',
                '#### 12.5 如何选择',
                '',
                '```text',
                '只是数值 / 枚举 / 明确的静态类型关系？',
                '    → static_cast',
                '',
                '需要在多态继承体系中检查实际对象类型？',

                '只需要调整 const / volatile 限定？',

                '',

                '参考：[`static_cast`](https://en.cppreference.com/w/cpp/language/static_cast)、[`dynamic_cast`](https://en.cppreference.com/w/cpp/language/dynamic_cast)、[`const_cast`](https://en.cppreference.com/w/cpp/language/const_cast)、[`reinterpret_cast`](https://en.cppreference.com/w/cpp/language/reinterpret_cast)。',

    <script>
        (function () {
            var root = document.getElementById('article-content');
            if (!root || !window.MutationObserver || !window.NodeFilter) return;

            function repairTextNode(node) {
                var parent = node.parentElement;
                if (!parent || parent.closest('pre, code, kbd, samp, script, style')) return;

                var text = node.nodeValue || '';
                var pattern = /\*\*([^*\n]+?)\*\*/g;
                if (!pattern.test(text)) return;
                pattern.lastIndex = 0;

                var fragment = document.createDocumentFragment();
                var lastIndex = 0;
                var match;

                while ((match = pattern.exec(text)) !== null) {
                    if (match.index > lastIndex) {
                        fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
                    }

                    var strong = document.createElement('strong');
                    strong.textContent = match[1].trim();
                    fragment.appendChild(strong);
                    lastIndex = pattern.lastIndex;
                }

                if (lastIndex < text.length) {
                    fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
                }

                node.parentNode.replaceChild(fragment, node);
            }

            function repairLiteralBoldMarkers() {
                var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
                var nodes = [];
                while (walker.nextNode()) nodes.push(walker.currentNode);
                nodes.forEach(repairTextNode);
            }

            var observer = new MutationObserver(repairLiteralBoldMarkers);
            observer.observe(root, { childList: true, subtree: true });
            repairLiteralBoldMarkers();
        })();
    </script>
