<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kyle 的旅行目录">
    <title>旅行目录 · Kyle</title>
    <link rel="icon" type="image/svg+xml" href="../static/img/logo-jy.svg">
    <link rel="stylesheet" href="../static/css/travel.css">
    <style>
        .travel-directory-page .hero { display: none; }
        .travel-directory-page .hero + .section { margin-top: 0; }
    </style>
</head>

<body class="travel-directory-page">
    <div class="travel-shell">
        <header class="topbar">
            <a class="brand" href="../" aria-label="返回 Kyle 主页">
                <span class="brand-mark">K</span>
                <span>Kyle · Travel Atlas</span>
            </a>
            <a class="back-link" href="../">← 返回主页</a>
        </header>

        <section class="hero">
            <p class="eyebrow">Travel archive</p>
            <h1>把路线、见闻和照片<br>慢慢收进行囊。</h1>
            <p>这里用于整理每一次旅行的攻略、实际行程与回顾记录。当前已创建一份福建双人旅行的筹备模板。</p>
            <div class="hero-meta">
                <span class="pill">旅行目录</span>
                <span class="pill">持续更新</span>
                <span class="pill">攻略 + 见闻</span>
            </div>
        </section>

        <section class="section">
            <div class="section-heading">
                <div>
                    <h2>旅行档案</h2>
                    <p>点击已创建的行程卡片，进入具体攻略页面。</p>
                </div>
            </div>

            <div class="trip-grid">
                <a class="trip-card active" href="./fujian-june-2026/">
                    <span class="status">准备中</span>
                    <h2>福建 · 双人旅行</h2>
                    <p>2026 年 6 月 22 日—27 日<br>6 天 5 晚 · 攻略框架已建立</p>
                    <span class="card-arrow">→</span>
                </a>

                <div class="trip-card empty">
                    <span class="status">以后再说</span>
                    <h2>下一段旅程</h2>
                    <p>新的目的地、日期和故事，会在这里继续展开。</p>
                </div>
            </div>
        </section>

        <footer class="page-footer">Kyle Travel Atlas · 记录仍在路上</footer>
    </div>
</body>

</html>
