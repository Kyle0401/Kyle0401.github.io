name: Patch C++ chapter outline indentation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-outline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch outline indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('learning/cpp/cpp-language/cpp-language-page.css')
          css = css_path.read_text(encoding='utf-8')
          old = '''.outline-level-5 { padding-left: 25px !important; }
          .outline-level-6 { padding-left: 36px !important; font-size: 11.5px !important; }'''.replace('          ', '')
          new = '''#outline-links a.outline-level-4 {
              padding-left: 14px;
              font-size: 12.5px;
              font-weight: 600;
          }

          #outline-links a.outline-level-5 {
              padding-left: 30px !important;
              font-size: 12px !important;
          }

          #outline-links a.outline-level-6 {
              padding-left: 46px !important;
              font-size: 11.5px !important;
          }'''.replace('          ', '')

          if old not in css:
              raise SystemExit('outline style marker not found')
          css = css.replace(old, new, 1)
          css_path.write_text(css, encoding='utf-8')

          html_path = Path('learning/cpp/cpp-language/index.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace('cpp-language-page.css?v=20260808a', 'cpp-language-page.css?v=20260808b', 1)
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-cpp-outline-indent.yml
          git add learning/cpp/cpp-language/cpp-language-page.css learning/cpp/cpp-language/index.html
          git commit -m '优化 C++ 本章目录层级缩进'
          git push origin HEAD:main
