name: Add C++ assertion notes

on:
  push:
    branches:
      - agent/add-cpp-assertion

permissions:
  contents: write

jobs:
  patch-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/add-cpp-assertion

      - name: Insert assertion section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path('learning/cpp/cpp-language/C++语言学习.md')
          text = path.read_text(encoding='utf-8')
          heading = '### 18、断言'
          marker = '\n## 二、C++特性'
          section_b64 = ''
          if heading not in text:
              if marker not in text:
                  raise SystemExit('target marker not found')
              section = base64.b64decode(section_b64).decode('utf-8')
              text = text.replace(marker, '\n\n' + section + '\n\n## 二、C++特性', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-cpp-assertion.yml
          git add 'learning/cpp/cpp-language/C++语言学习.md'
          git commit -m '补充 C++ 断言笔记'
          git push origin HEAD:agent/add-cpp-assertion
