name: Patch C++ constexpr notes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch notes
        env:
          SECTION_B64: ""
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('learning/cpp/cpp-language/C++语言学习.md')
          text = path.read_text(encoding='utf-8')
          heading = '### 19、`constexpr` 与常量表达式'
          marker = '\n## 二、C++特性'
          section = base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')

          if heading not in text:
              if marker not in text:
                  raise SystemExit('target marker not found')
              text = text.replace(marker, '\n\n' + section + '\n\n## 二、C++特性', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-cpp-constexpr.yml
          git add 'learning/cpp/cpp-language/C++语言学习.md'
          git commit -m '补充 C++ constexpr 与常量表达式笔记'
          git push origin HEAD:main
