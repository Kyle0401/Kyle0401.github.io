name: Remove selected skill icons

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove icons and compact layouts
        shell: bash
        run: |
          python - <<'PY'
          import math
          import xml.etree.ElementTree as ET

          REMOVE_INDEXES = {12, 13, 14, 17, 18, 23, 26, 31, 32, 34}
          SVG_NS = "http://www.w3.org/2000/svg"
          XLINK_NS = "http://www.w3.org/1999/xlink"

          ET.register_namespace("", SVG_NS)
          ET.register_namespace("xlink", XLINK_NS)

          def compact_svg(path: str, icons_per_row: int, display_width: float) -> None:
              tree = ET.parse(path)
              root = tree.getroot()
              group_tag = f"{{{SVG_NS}}}g"
              svg_tag = f"{{{SVG_NS}}}svg"

              all_groups = [child for child in list(root) if child.tag == group_tag]
              icon_groups = [
                  group for group in all_groups
                  if any(child.tag == svg_tag for child in list(group))
              ]

              if len(icon_groups) != 35:
                  raise RuntimeError(f"{path}: expected 35 skill groups, found {len(icon_groups)}")

              kept_groups = [
                  group for index, group in enumerate(icon_groups)
                  if index not in REMOVE_INDEXES
              ]

              for group in all_groups:
                  root.remove(group)

              for index, group in enumerate(kept_groups):
                  x = (index % icons_per_row) * 300
                  y = (index // icons_per_row) * 300
                  group.set("transform", f"translate({x}, {y})")
                  root.append(group)

              columns = min(icons_per_row, len(kept_groups))
              rows = math.ceil(len(kept_groups) / icons_per_row)
              view_width = (columns - 1) * 300 + 256
              view_height = (rows - 1) * 300 + 256
              display_height = display_width * view_height / view_width

              root.set("viewBox", f"0 0 {view_width} {view_height}")
              root.set("width", f"{display_width:g}")
              root.set("height", f"{display_height:.2f}".rstrip("0").rstrip("."))

              tree.write(path, encoding="unicode", xml_declaration=False)

          compact_svg("static/svg/skillPc.svg", icons_per_row=14, display_width=779.25)
          compact_svg("static/svg/skillWap.svg", icons_per_row=7, display_width=441.75)
          PY

      - name: Commit updated SVG files
        shell: bash
        run: |
          rm -f .github/workflows/remove-skill-icons.yml .github/skill-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unused skill icons"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
