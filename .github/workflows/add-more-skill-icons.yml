                <text x="128" y="160" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700" fill="#FFFFFF">µV5</text>
              </svg>'''),
              ("lightroom", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>Adobe Lightroom</title>
                <rect width="256" height="256" rx="60" fill="#001E36"/>
