name: Add more skill icons

on:
  push:
    branches:
      - add-more-skill-icons
    paths:
      - .github/workflows/add-more-skill-icons.yml

permissions:
  contents: write

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: add-more-skill-icons

      - name: Append icons and rebuild layouts
        shell: bash
        run: |
          python - <<'PY'
          import math
          import xml.etree.ElementTree as ET

          SVG_NS = "http://www.w3.org/2000/svg"
          ET.register_namespace("", SVG_NS)

          ICONS = [
