                <text x="128" y="159" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="600" fill="#31A8FF">Lr</text>
              </svg>'''),
              ("davinci-resolve", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>DaVinci Resolve</title>
                <rect width="256" height="256" rx="60" fill="#242938"/>
                <circle cx="128" cy="82" r="44" fill="#EF476F"/>
                <circle cx="84" cy="158" r="44" fill="#06D6A0"/>
                <circle cx="172" cy="158" r="44" fill="#118AB2"/>
                <circle cx="128" cy="128" r="34" fill="#242938" stroke="#FFFFFF" stroke-width="8"/>
                <path d="M128 103l22 38h-44z" fill="#FFFFFF"/>
              </svg>'''),
              ("cplusplus", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>C++</title>
                <rect width="256" height="256" rx="60" fill="#00599C"/>
                <g transform="translate(28 28) scale(8.333333)" fill="#FFFFFF"><path d="M22.394 6c-.167-.29-.398-.543-.652-.69L12.926.22c-.509-.294-1.34-.294-1.848 0L2.26 5.31c-.508.293-.923 1.013-.923 1.6v10.18c0 .294.104.62.271.91.167.29.398.543.652.69l8.816 5.09c.508.293 1.34.293 1.848 0l8.816-5.09c.254-.147.485-.4.652-.69.167-.29.27-.616.27-.91V6.91c.003-.294-.1-.62-.268-.91zM12 19.11c-3.92 0-7.109-3.19-7.109-7.11 0-3.92 3.19-7.11 7.11-7.11a7.133 7.133 0 016.156 3.553l-3.076 1.78a3.567 3.567 0 00-3.08-1.78A3.56 3.56 0 008.444 12 3.56 3.56 0 0012 15.555a3.57 3.57 0 003.08-1.778l3.078 1.78A7.135 7.135 0 0112 19.11zm7.11-6.715h-.79v.79h-.79v-.79h-.79v-.79h.79v-.79h.79v.79h.79zm2.962 0h-.79v.79h-.79v-.79h-.79v-.79h.79v-.79h.79v.79h.79z"/></g>
              </svg>'''),
              ("c", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>C</title>
                <rect width="256" height="256" rx="60" fill="#659AD2"/>
                <g transform="translate(28 28) scale(8.333333)" fill="#FFFFFF"><path d="M16.5921 9.1962s-.354-3.298-3.627-3.39c-3.2741-.09-4.9552 2.474-4.9552 6.14 0 3.6651 1.858 6.5972 5.0451 6.5972 3.184 0 3.5381-3.665 3.5381-3.665l6.1041.365s.36 3.31-2.196 5.836c-2.552 2.5241-5.6901 2.9371-7.8762 2.9201-2.19-.017-5.2261.034-8.1602-2.97-2.938-3.0101-3.436-5.9302-3.436-8.8002 0-2.8701.556-6.6702 4.047-9.5502C7.444.72 9.849 0 12.254 0c10.0422 0 10.7172 9.2602 10.7172 9.2602z"/></g>
              </svg>'''),
              ("visual-studio", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>Visual Studio</title>
                <rect width="256" height="256" rx="60" fill="#5C2D91"/>
                <path d="M39 88l39-25 51 45 58-50 30 15v110l-30 15-58-50-51 45-39-25 52-40zm148 3l-38 37 38 37z" fill="#FFFFFF"/>
              </svg>'''),
              ("vivado", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>AMD Xilinx Vivado</title>
                <rect width="256" height="256" rx="60" fill="#242938"/>
                <path d="M45 66h38l45 107 45-107h38l-64 146h-38z" fill="#F36F21"/>
                <g fill="#FFFFFF"><rect x="42" y="45" width="14" height="14" rx="2"/><rect x="200" y="45" width="14" height="14" rx="2"/><rect x="42" y="197" width="14" height="14" rx="2"/><rect x="200" y="197" width="14" height="14" rx="2"/></g>
                <path d="M56 52h144M49 59v138M207 59v138M56 204h144" stroke="#FFFFFF" stroke-width="5" opacity=".65"/>
              </svg>'''),
              ("stm32cubemx", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>STM32CubeMX</title>
                <rect width="256" height="256" rx="60" fill="#03234B"/>
                <path d="M128 39l70 40v80l-70 40-70-40V79z" fill="#00AEEF"/>
                <path d="M128 39v80l70 40M128 119L58 79M128 119v80" fill="none" stroke="#FFFFFF" stroke-width="9" opacity=".9"/>
                <text x="128" y="151" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">MX</text>
              </svg>'''),
              ("chatgpt-codex", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>ChatGPT Codex</title>
                <rect width="256" height="256" rx="60" fill="#0D0D0D"/>
                <g fill="none" stroke="#10A37F" stroke-width="14"><circle cx="128" cy="73" r="39"/><circle cx="176" cy="101" r="39"/><circle cx="176" cy="156" r="39"/><circle cx="128" cy="183" r="39"/><circle cx="80" cy="156" r="39"/><circle cx="80" cy="101" r="39"/></g>
                <circle cx="128" cy="128" r="31" fill="#0D0D0D" stroke="#FFFFFF" stroke-width="7"/>
                <text x="128" y="138" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">CODEX</text>
              </svg>'''),
              ("gemini", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>Google Gemini</title>
                <defs><linearGradient id="geminiGradient" x1="45" y1="42" x2="211" y2="214" gradientUnits="userSpaceOnUse"><stop stop-color="#4E8CFF"/><stop offset=".48" stop-color="#9B72F2"/><stop offset="1" stop-color="#F45AA5"/></linearGradient></defs>
                <rect width="256" height="256" rx="60" fill="#16171A"/>
                <path d="M128 33c9 50 45 86 95 95-50 9-86 45-95 95-9-50-45-86-95-95 50-9 86-45 95-95z" fill="url(#geminiGradient)"/>
                <circle cx="128" cy="128" r="20" fill="#FFFFFF" opacity=".95"/>
              </svg>'''),
              ("proteus", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>Proteus</title>
                <rect width="256" height="256" rx="60" fill="#004A80"/>
                <path d="M66 49h70c39 0 62 20 62 55s-23 56-62 56h-28v47H66zm42 34v43h25c16 0 25-7 25-22 0-14-9-21-25-21z" fill="#FFFFFF"/>
                <g fill="#38BDF8"><circle cx="44" cy="78" r="9"/><circle cx="44" cy="178" r="9"/><circle cx="212" cy="78" r="9"/><circle cx="212" cy="178" r="9"/></g>
                <path d="M53 78h30M53 178h30M173 78h30M173 178h30" stroke="#38BDF8" stroke-width="7"/>
              </svg>'''),
              ("jlcpcb", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>嘉立创 JLCPCB</title>
                <rect width="256" height="256" rx="60" fill="#008F6A"/>
                <path d="M44 65h168v126H44z" fill="#FFFFFF" opacity=".12"/>
                <text x="128" y="142" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">JLC</text>
                <path d="M57 171h142" stroke="#FF8A00" stroke-width="12" stroke-linecap="round"/>
                <g fill="#FF8A00"><circle cx="57" cy="171" r="10"/><circle cx="199" cy="171" r="10"/></g>
              </svg>'''),
              ("altium-designer", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>Altium Designer</title>
                <rect width="256" height="256" rx="60" fill="#1E1E1E"/>
                <path d="M55 190L111 55h35l55 135h-38l-11-30H103l-11 30zm60-63h25l-12-35z" fill="#FFB000"/>
                <path d="M163 67h24c31 0 49 17 49 47s-18 47-49 47h-24zm23 25v44h4c14 0 22-8 22-22s-8-22-22-22z" fill="#FF6A00"/>
              </svg>'''),
              ("latex", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>LaTeX</title>
                <rect width="256" height="256" rx="60" fill="#008080"/>
                <text x="128" y="151" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="72" font-weight="700" fill="#FFFFFF">LaTeX</text>
                <path d="M44 174h168" stroke="#FFFFFF" stroke-width="6" opacity=".7"/>
              </svg>'''),
              ("wireshark", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>Wireshark</title>
                <rect width="256" height="256" rx="60" fill="#1679A7"/>
                <path d="M38 163c45-12 84-45 112-102 6 42 27 73 68 91-33 2-64 15-91 43-25-20-55-31-89-32z" fill="#FFFFFF"/>
                <path d="M44 185c36-9 68-8 96 4 27 12 51 14 73 8" fill="none" stroke="#B9E7F7" stroke-width="10" stroke-linecap="round"/>
              </svg>'''),
              ("arduino", '''<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
                <title>Arduino</title>
                <rect width="256" height="256" rx="60" fill="#00878F"/>
                <g transform="translate(28 28) scale(8.333333)" fill="#FFFFFF"><path d="M18.087 6.146c-.3 0-.607.017-.907.069-2.532.367-4.23 2.239-5.18 3.674-.95-1.435-2.648-3.307-5.18-3.674a6.49 6.49 0 0 0-.907-.069C2.648 6.146 0 8.77 0 12s2.656 5.854 5.913 5.854c.3 0 .607-.017.916-.069 2.531-.376 4.23-2.247 5.18-3.683.949 1.436 2.647 3.307 5.18 3.683.299.043.607.069.915.069C21.344 17.854 24 15.23 24 12s-2.656-5.854-5.913-5.854zM6.53 15.734a3.837 3.837 0 0 1-.625.043c-2.148 0-3.889-1.7-3.889-3.777 0-2.085 1.749-3.777 3.898-3.777.208 0 .416.017.624.043 2.39.35 3.847 2.768 4.347 3.734-.508.974-1.974 3.384-4.355 3.734zm11.558.043c-.208 0-.416-.017-.624-.043-2.39-.35-3.856-2.768-4.347-3.734.491-.966 1.957-3.384 4.347-3.734.208-.026.416-.043.624-.043 2.149 0 3.89 1.7 3.89 3.777 0 2.085-1.75 3.777-3.89 3.777zm1.65-4.404v1.134h-1.205v1.182h-1.156v-1.182H16.17v-1.134h1.206V10.19h1.156v1.183h1.206zM4.246 12.498H7.82v-1.125H4.245v1.125z"/></g>
              </svg>'''),
          ]

          def rebuild(path: str, icons_per_row: int, display_width: float) -> None:
              tree = ET.parse(path)
              root = tree.getroot()
              group_tag = f"{{{SVG_NS}}}g"

              direct_groups = [child for child in list(root) if child.tag == group_tag]
              for group in direct_groups:
                  if group.get("data-added-skill") in {slug for slug, _ in ICONS}:
                      root.remove(group)

              groups = [child for child in list(root) if child.tag == group_tag]

              for slug, svg_text in ICONS:
                  group = ET.Element(group_tag, {"data-added-skill": slug})
                  group.append(ET.fromstring(svg_text))
                  root.append(group)
                  groups.append(group)

              for index, group in enumerate(groups):
                  x = (index % icons_per_row) * 300
                  y = (index // icons_per_row) * 300
                  group.set("transform", f"translate({x}, {y})")

              columns = min(icons_per_row, len(groups))
              rows = math.ceil(len(groups) / icons_per_row)
              view_width = (columns - 1) * 300 + 256
              view_height = (rows - 1) * 300 + 256
              display_height = display_width * view_height / view_width

              root.set("viewBox", f"0 0 {view_width} {view_height}")
              root.set("width", f"{display_width:g}")
              root.set("height", f"{display_height:.2f}".rstrip("0").rstrip("."))

              ET.indent(tree, space="  ")
              tree.write(path, encoding="unicode", xml_declaration=False)

          rebuild("static/svg/skillPc.svg", icons_per_row=14, display_width=779.25)
          rebuild("static/svg/skillWap.svg", icons_per_row=7, display_width=441.75)
          PY

      - name: Commit generated SVG files
        shell: bash
        run: |
          rm -f .github/workflows/add-more-skill-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/svg/skillPc.svg static/svg/skillWap.svg .github/workflows/add-more-skill-icons.yml
          git commit -m "Add embedded, AI, EDA, and design skill icons"
          git push origin HEAD
