name: Remove FreeRTOS authorization note

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-freertos-authorization-note.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove the specified phrase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('learning/freertos/FreeRTOS学习.md')
          target = '；正文、代码与图片的转载及编号调整已获授权'
          text = path.read_text(encoding='utf-8')
          count = text.count(target)
          if count != 1:
              raise SystemExit(f'Expected exactly one occurrence, found {count}')
          path.write_text(text.replace(target, ''), encoding='utf-8')
          PY

      - name: Commit the change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'learning/freertos/FreeRTOS学习.md'
          git commit -m 'Remove FreeRTOS authorization note'
          git push
