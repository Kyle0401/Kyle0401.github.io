name: Patch constexpr note
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          rm .github/workflows/patch-cpp-constexpr-declaration-order.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '补充 constexpr 声明说明符顺序笔记'
          git push
