name: Refine C++ template parameter notes

on:
  push:
    branches:
      - agent/add-template-parameter-notes
    paths:
      - .github/workflows/refine-cpp-template-notes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-template-parameter-notes

      - name: Refine note and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('learning/cpp/cpp-language/C++语言学习.md')
          text = path.read_text(encoding='utf-8')
          old_intro = '模板参数并不一定代表“类型”。C++ 模板参数中常见的两类是**类型模板参数**和**非类型模板参数**；从 C++26 起，后者在标准术语中改称**常量模板参数（constant template parameter）**。'
          new_intro = '模板参数并不一定代表“类型”。模板参数通常可以分为**类型模板参数**、**非类型模板参数**（C++26 起标准术语改称**常量模板参数，constant template parameter**）和**模板模板参数**。下面这个 `Tensor` 例子涉及前两类。'
          old_example = '`class T` 中的 `T` 代表一种**类型**。在模板参数列表中，这里的 `class` 与 `typename` 用来声明类型模板参数，因此下面两种写法在这个场景中等价：\n\n```cpp\ntemplate<class T>\ntemplate<typename T>\n```'
          new_example = '`class T` 中的 `T` 代表一种**类型**。在模板参数列表中，这里的 `class` 与 `typename` 都可以用来声明类型模板参数，因此下面两个类模板中的 `T` 性质相同：\n\n```cpp\ntemplate<class T>\nstruct A {};\n\ntemplate<typename T>\nstruct B {};\n```'
          if text.count(old_intro) != 1:
              raise SystemExit(f'intro match count: {text.count(old_intro)}')
          if text.count(old_example) != 1:
              raise SystemExit(f'example match count: {text.count(old_example)}')
          text = text.replace(old_intro, new_intro, 1)
          text = text.replace(old_example, new_example, 1)
          path.write_text(text, encoding='utf-8')
          workflow = Path('.github/workflows/refine-cpp-template-notes.yml')
          if workflow.exists():
              workflow.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'learning/cpp/cpp-language/C++语言学习.md' .github/workflows/refine-cpp-template-notes.yml
          git commit -m '校正模板参数示例'
          git push origin HEAD:agent/add-template-parameter-notes
