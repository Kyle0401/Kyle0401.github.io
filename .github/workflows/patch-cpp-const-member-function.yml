name: Patch C++ const member function notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cpp-const-member-function.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          path = Path('learning/cpp/cpp-language/C++语言学习.md')
          text = path.read_text(encoding='utf-8')

          old = base64.b64decode('').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')

          if old not in text:
              raise SystemExit('target const paragraph not found; refusing to modify')
          if '#### 5.1 `static` 关键字' in text:
              raise SystemExit('static section already present in markdown; refusing to duplicate')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/patch-cpp-const-member-function.yml

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '补充 C++ const 成员函数笔记'
          git push
